# the conda-build parameters to use for disabling --skip-existing
build_parameters:
  - "--suppress-variables"
  #- "--skip-existing"
  - "--error-overlinking"
  - "--error-overdepending"
  # Staging rebuild: skip re-test; builds validate against python+flit staging.
  - "--no-test"

upload_channels:
  - ad-testing/label/py315

# After promote: consume from testing
channels:
  - ad-testing/label/py315

build_env_vars:
  ANACONDA_ROCKET_ENABLE_PY315: yes
